[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postaldatapi"
version = "0.1.0"
description = "Python SDK for the PostalDataPI global postal code API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Thom Ives", email = "thom@postaldatapi.com" },
]
keywords = ["postal-code", "zipcode", "geocoding", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpserver>=1.0",
]

[project.urls]
Homepage = "https://postaldatapi.com"
Documentation = "https://docs.postaldatapi.com"
Repository = "https://github.com/PostalDataPI/postaldatapi-python"
Issues = "https://github.com/PostalDataPI/postaldatapi-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/postaldatapi"]
