[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postaldatapi"
version = "0.1.0"
description = "Python client for the PostalDataPI postal code API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Thom Ives" }]
requires-python = ">=3.8"
dependencies = ["requests>=2.20"]
keywords = ["postal code", "zip code", "geocoding", "address validation", "api client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/PostalDataPI/postaldatapi-python"
"Bug Tracker" = "https://github.com/PostalDataPI/postaldatapi-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "requests-mock>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
